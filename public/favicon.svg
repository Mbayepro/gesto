<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e134b" />
      <stop offset="100%" stop-color="#0f0928" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Stylized G / Cash Register & Receipt Icon -->
  <g filter="url(#glow)">
    <!-- Main register / receipt body -->
    <rect x="120" y="120" width="272" height="272" rx="48" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lines for invoice & ledger -->
    <line x1="184" y1="200" x2="328" y2="200" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <line x1="184" y1="260" x2="328" y2="260" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <line x1="184" y1="320" x2="260" y2="320" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

    <!-- Golden Coin / FCFA Point indicator -->
    <circle cx="328" cy="320" r="26" fill="url(#gold)" />
  </g>
</svg>
